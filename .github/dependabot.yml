version: 2
updates:
    # Update npm dependencies
    - package-ecosystem: "npm"
      directory: "/"
      schedule:
          interval: "weekly"
      open-pull-requests-limit: 10
      groups:
          # Group all minor and patch updates together
          npm-minor-patch:
              patterns:
                  - "*"
              update-types:
                  - "minor"
                  - "patch"
      commit-message:
          prefix: "ci(deps): "

    # Update GitHub Actions
    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "weekly"
      open-pull-requests-limit: 5
      commit-message:
          prefix: "ci(deps): "
