on:
    pull_request:
    workflow_dispatch:

name: test
jobs:
  versions:
    name: Determine Shopware versions to test
    runs-on: ubuntu-24.04
    outputs:
      first-version: ${{ steps.versions.outputs.first-version }}
      latest-version: ${{ steps.versions.outputs.latest-version }}
      lts-first-version: ${{ steps.versions.outputs.lts-first-version }}
      lts-latest-version: ${{ steps.versions.outputs.lts-latest-version }}
    steps:
      - name: Generate versions
        id: versions
        uses: shopware/github-actions/versions@main

  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm run lint

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm run build

  test:
    name: test shopware ${{ matrix.SHOPWARE_VERSION }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: [ versions ]
    strategy:
      matrix:
        include:
          - SHOPWARE_VERSION: ${{ needs.versions.outputs.lts-latest-version }}
            PORT: 8011
          - SHOPWARE_VERSION: ${{ needs.versions.outputs.first-version }}
            PORT: 8021
          - SHOPWARE_VERSION: ${{ needs.versions.outputs.latest-version }}
            PORT: 8031
    env:
      WEBSERVER_COMMAND: '' # this will disable the log output
      SHOPWARE_VERSION: ${{ matrix.SHOPWARE_VERSION }}
      PORT: ${{ matrix.PORT }}
    steps:
    - uses: actions/checkout@v4

    - name: Start shopware
      run: docker compose up --pull=always --quiet-pull --wait

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Playwright tests
      env:
        APP_URL: http://localhost:${{ matrix.PORT }}
      run: npx playwright test --repeat-each 4

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report-${{ matrix.SHOPWARE_VERSION }}
        path: test-results/
        retention-days: 7

  test-saas:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    concurrency: saas # only allow one job at a time
    env:
      APP_URL: ${{ secrets.SAAS_APP_URL }}
      SHOPWARE_ADMIN_USERNAME: ${{ secrets.SAAS_SHOPWARE_ADMIN_USERNAME }}
      SHOPWARE_ADMIN_PASSWORD: ${{ secrets.SAAS_SHOPWARE_ADMIN_PASSWORD }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test --repeat-each 2
